[package]
name = "tardiff"
version = "0.1.0"
edition = "2024"
default-run = "tardiff"
description = "Compare tar archives, including compressed tar files, and show entry-level diffs"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/ctron/tardiff"
homepage = "https://github.com/ctron/tardiff"
documentation = "https://docs.rs/tardiff"
keywords = ["tar", "diff", "archive", "cli", "compression"]
categories = ["command-line-utilities", "compression", "filesystem"]

[dependencies]
bzip2 = "0.6.1"
clap = { version = "4.6.1", features = ["derive"] }
comfy-table = { version = "7.2.2", features = ["custom_styling"] }
console = "0.16.3"
flate2 = "1.1.9"
indicatif = "0.18.4"
sha2 = "0.11.0"
strum = { version = "0.28.0", features = ["derive"] }
tar = "0.4.45"
time = { version = "0.3.47", features = ["formatting", "macros"] }
thiserror = "2.0.18"
xz2 = "0.1.7"
zstd = "0.13.3"
